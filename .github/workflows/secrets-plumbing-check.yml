name: Secrets Plumbing Check

# Manually-dispatched smoke test that proves the 1Password -> GitHub Actions
# service-account path works, WITHOUT touching any signing material. It resolves
# only the non-sensitive `canary` field (value "ok") of vault `github`, item
# `android-signing`. The release / dev-latest signing jobs reuse the same auth
# path via .github/actions/op-load-signing-secrets, so a green run here confirms
# the plumbing independently of a real signed build.
#
# workflow_dispatch only: this never runs on push/PR and never reads a keystore
# or password. GitHub registers a workflow_dispatch trigger from the default
# branch, so this is dispatchable once the file lands there.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-plumbing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: Resolve 1Password canary
    runs-on: ubuntu-latest
    env:
      # Read-only 1Password service-account token; the only signing-related
      # secret stored in GitHub. Maps to the variable the op CLI reads.
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.ANDROID_ACTIONS_SERVICE_ACCOUNT }}
    steps:
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@a5215d3a7f75c1629216c465ea9ab3ab399c4b71 # v4.0.0

      - name: Resolve canary (no signing material touched)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OP_SERVICE_ACCOUNT_TOKEN:-}" ]; then
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN is empty -- is the ANDROID_ACTIONS_SERVICE_ACCOUNT secret set on this repo?"
            exit 1
          fi
          # Resolve ONLY the non-sensitive canary. Its value ("ok") is not secret,
          # but we still avoid echoing the resolved value and assert on it instead.
          if canary="$(op read op://github/android-signing/canary)" && [ -n "$canary" ]; then
            echo "1Password plumbing OK"
          else
            echo "::error::Could not resolve op://github/android-signing/canary -- check the service-account token and item"
            exit 1
          fi
