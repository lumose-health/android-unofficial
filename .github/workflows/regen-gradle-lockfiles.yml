name: Regenerate Gradle Lockfiles

# Renovate runs inside the renovate/renovate container, which has no Android
# SDK, so it cannot execute the AGP build to refresh the committed
# gradle.lockfile files when it bumps a Gradle dependency. With dependency
# locking enforced (see build.gradle.kts), a stale lockfile fails the
# Dependency Scan Gate on the Renovate PR. This workflow closes that loop: on
# Renovate Gradle PRs it regenerates the lockfiles on a runner that has the
# Android SDK and pushes the refreshed files back to the PR branch. The push
# retriggers this workflow once via `synchronize`; the second run produces no
# diff and exits without pushing.
#
# UNPROVEN PATH: this repository does not yet have Renovate configured, so this
# workflow is dormant -- it cannot fire until (a) Renovate is installed and
# (b) it opens its first Gradle bump PR. Same caveat as the platform monorepo,
# doubled: verify end-to-end on the first real Renovate Gradle PR.
#
# Two-job privilege split: the `regenerate` job executes PR-branch build
# scripts and therefore never sees a credential (read-only ambient token, no
# app token); it hands the refreshed lockfiles to the `push` job as an
# artifact. The `push` job holds the app token but never executes PR-authored
# code -- it only performs git operations, with hooks disabled.
#
# See docs/dev/security-testing.md for why the lockfiles exist (OSV-Scanner
# reads only gradle.lockfile, not build.gradle.kts or the version catalog).

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - '**/build.gradle.kts'

permissions:
  contents: read

concurrency:
  group: regen-gradle-lockfiles-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate lockfiles (unprivileged)
    # Hard guards (mirror the monorepo's auto-merge/regen guards):
    #   1. PR author is glycemicgpt-renovate (cannot be impersonated).
    #   2. Same-repo head -- the push job pushes back to the branch, never forks.
    #   3. Renovate branch prefix, defense in depth.
    if: |
      github.event.pull_request.user.login == 'glycemicgpt-renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      source_sha: ${{ steps.source-sha.outputs.sha }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      # The push job checks out this exact SHA so the refreshed lockfiles can
      # never be overlaid onto a newer branch head than they were built from.
      - name: Record generated commit
        id: source-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # This job executes PR-branch build scripts; never let it write to the
          # shared Actions cache other workflows read from.
          cache-read-only: true

      # Executes build scripts from the PR branch. This job must stay
      # credential-free: no app token is ever minted here.
      - name: Regenerate lockfiles
        run: |
          ./gradlew resolveAndLockAll --write-locks --console=plain
          (cd tools/medtronic-ble-spike && ./gradlew dependencies --write-locks --console=plain > /dev/null)

      - name: Detect lockfile changes
        id: diff
        run: |
          CHANGED=$(git status --porcelain -- '*gradle.lockfile' | wc -l)
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          git status --porcelain -- '*gradle.lockfile'

      - name: Upload refreshed lockfiles
        if: steps.diff.outputs.changed != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-lockfiles
          path: |
            settings-gradle.lockfile
            **/gradle.lockfile
          if-no-files-found: error
          retention-days: 1

  push:
    name: Commit refreshed lockfiles (privileged)
    needs: regenerate
    if: needs.regenerate.outputs.changed != '0'
    runs-on: ubuntu-latest
    steps:
      # Git operations only from here on -- no PR-authored code is executed in
      # this job (checkout does not run repository code, and hooks are disabled
      # on commit/push). Pinned to the SHA the lockfiles were built from: if
      # Renovate advances the branch while these jobs run, the non-force push
      # below is rejected as non-fast-forward instead of committing lockfiles
      # that no longer match the build files.
      - name: Checkout generated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.regenerate.outputs.source_sha }}
          persist-credentials: false

      - name: Overlay refreshed lockfiles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: gradle-lockfiles

      - name: Generate token for glycemicgpt-renovate
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Scope the token to exactly what the push needs; without this it
          # inherits every permission of the app installation.
          permission-contents: write

      - name: Commit and push refreshed lockfiles
        env:
          PUSH_TOKEN: ${{ steps.generate-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name "glycemicgpt-renovate[bot]"
          git config user.email "glycemicgpt-renovate[bot]@users.noreply.github.com"
          git add -- '*gradle.lockfile'
          if git diff --cached --quiet; then
            echo "::notice::lockfiles already up to date on this head; nothing to push"
            exit 0
          fi
          # --signoff satisfies this repo's DCO check on the Renovate PR.
          git commit --signoff -m "chore(deps): refresh gradle lockfiles"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${HEAD_REF}"
