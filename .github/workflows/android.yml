name: Android

# Build/test/lint gate for the phone app, Wear OS companion, watch face, and
# device data driver plugins that live at this repository's root (app/,
# wear-device/, watchface/, plugins/) -- this repo's Gradle project root IS
# the repository root, unlike the platform monorepo where it's nested under
# apps/mobile/.
#
# detect-changes is still worth keeping even though this repo is single-purpose:
# it skips the build for docs/governance-only PRs (README, CLAUDE.md, docs/**)
# that don't touch anything Gradle resolves.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Android-Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            android:
              - 'app/**'
              - 'wear-device/**'
              - 'watchface/**'
              - 'plugins/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
              - 'settings-gradle.lockfile'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/android.yml'

  build:
    name: Build & Test
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.should_build == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            wear-device/build/outputs/apk/debug/*.apk
          retention-days: 14

  instrumented-tests:
    name: Instrumented Tests (emulator)
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.should_build == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Non-required check while it beds in: this job reports its own status and is
    # intentionally NOT folded into the required "Android Gate" below, so a flaky
    # emulator can't wedge unrelated PRs. Promote it to a required check in branch
    # protection once it has proven stable, mirroring the platform monorepo's rollout.
    # See docs/dev/instrumented-tests-ci.md.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Single pinned API level to start (matches the app's targetSdk). The emulator
      # uses the google_apis x86_64 image so KVM acceleration is available on the runner.
      API_LEVEL: 35
    steps:
      # ubuntu-latest exposes /dev/kvm but not to the runner user by default; this udev
      # rule grants access so the x86_64 emulator boots with hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Restore the cached AVD + its boot snapshot so subsequent runs skip image
      # download and cold boot. Restore + explicit save (rather than the combined
      # cache action) so the snapshot is persisted ONLY after a clean generation:
      # the save step below is skipped on cancellation/failure, which prevents a
      # partial, corrupt snapshot from poisoning the cache. The `-v1` key prefix
      # also gives a one-line manual eviction path if a bad snapshot ever lands.
      - name: Restore AVD cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v1-${{ env.API_LEVEL }}-google_apis-x86_64

      # On a cache miss, create the AVD and generate a boot snapshot.
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Persist the freshly generated snapshot only when generation succeeded (a
      # cancelled/failed Create step skips this, so no partial snapshot is saved).
      - name: Save AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v1-${{ env.API_LEVEL }}-google_apis-x86_64

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The action manages emulator boot/readiness; this runs the debug instrumented
          # suite (Compose/espresso UI + Room migration tests) and installs both APKs.
          script: ./gradlew :app:connectedDebugAndroidTest

      # Always publish the report so a red run is debuggable from the PR (and so a real
      # failure is distinguishable from a compile-only skip).
      - name: Upload instrumented test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          retention-days: 14
          if-no-files-found: ignore

  android-gate:
    name: Android Gate
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: always()
    steps:
      - name: Evaluate result
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          SHOULD_BUILD: ${{ needs.detect-changes.outputs.should_build }}
          BUILD_RESULT: ${{ needs.build.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "detect-changes failed (result: $DETECT_RESULT)"
            exit 1
          fi

          # workflow_dispatch always requires build success
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$BUILD_RESULT" = "success" ]; then
              echo "Android build & test passed (manual dispatch)"
              exit 0
            fi
            echo "Android build failed (result: $BUILD_RESULT)"
            exit 1
          fi

          if [ "$SHOULD_BUILD" != "true" ]; then
            echo "No Android-relevant changes -- skipped"
            exit 0
          fi
          if [ "$BUILD_RESULT" = "success" ]; then
            echo "Android build & test passed"
            exit 0
          fi
          echo "Android build failed or was cancelled (result: $BUILD_RESULT)"
          exit 1
