name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: the default GITHUB_TOKEN is read-only for every job. Each
# actual write in this workflow -- release PRs, tags, releases, PR merges, and
# APK asset uploads -- is performed with a scoped GitHub App token (release-please
# and the fallback checkout receive it directly -- the latter persists
# credentials for its git push; auto-merge and the upload step export it as
# GH_TOKEN), never with the ambient GITHUB_TOKEN, and read-only checkouts use
# persist-credentials: false. So no job needs a write grant.
permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # The RELEASE app key exists only as a secret in this approval-gated
    # environment (no plain org/repo copy).
    environment: release-gated
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Generate token for glycemicgpt-release
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  auto-merge-release:
    name: Auto-merge Release PR
    runs-on: ubuntu-latest
    # MERGE is now a gated env secret (no plain/org copy). This job mints
    # MERGE, so it must declare the environment to resolve the key -- and
    # it pauses for a required-reviewer approval on every run.
    # Pause-tolerant: it only fires on push:main after a release-please PR
    # is opened (a human-initiated promotion is present).
    environment: release-gated
    needs: release-please
    if: needs.release-please.outputs.pr != ''

    steps:
      - name: Generate token for glycemicgpt-merge
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}

      - name: Auto-merge release PR
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ needs.release-please.outputs.pr }}
        run: |
          PR_NUM=$(echo "$PR_NUMBER" | grep -oE '[0-9]+' | head -1)

          if [ -n "$PR_NUM" ]; then
            echo "Auto-merging release PR #$PR_NUM"
            gh pr merge "$PR_NUM" --squash --admin --repo ${{ github.repository }}
          else
            echo "No PR number found"
          fi

  # Detect whether the promotion contains changes to buildable code paths.
  # Doc-only promotions (README, GOVERNANCE, CLAUDE.md, docs/) should NOT
  # trigger a fallback versioned release + signed APK build.
  detect-deployable-changes:
    name: Check for Deployable Changes
    runs-on: ubuntu-latest
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created != 'true' &&
      needs.release-please.outputs.pr == '' &&
      contains(github.event.head_commit.message, 'promote develop to main')
    outputs:
      has_deployable_changes: ${{ steps.check.outputs.has_deployable_changes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect deployable file changes
        id: check
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
          # Compare promotion merge to its first parent (main before merge)
          CHANGED=$(git diff --name-only "${MERGE_SHA}^1" "$MERGE_SHA")
          echo "Changed files in promotion:"
          printf '%s\n' "$CHANGED"

          # Deployable paths: everything Gradle resolves for the phone/wear/watchface
          # build. This repo's project root IS the repository root.
          PATTERN='^(app/|wear-device/|watchface/|plugins/|gradle/|gradlew|settings\.gradle\.kts|settings-gradle\.lockfile|build\.gradle\.kts|gradle\.properties)'
          MATCHED=$(printf '%s\n' "$CHANGED" | grep -E "$PATTERN" || true)

          if [ -n "$MATCHED" ]; then
            echo "has_deployable_changes=true" >> "$GITHUB_OUTPUT"
            echo "Deployable files that triggered release:"
            printf '%s\n' "$MATCHED"
          else
            echo "has_deployable_changes=false" >> "$GITHUB_OUTPUT"
            echo "No deployable changes -- skipping fallback release"
          fi

  # Fallback: when a promotion merge has no releasable conventional commits
  # (only chore/ci/docs/test) BUT contains deployable code changes,
  # release-please skips. This job creates a patch release so every
  # code-changing promotion produces a versioned, signed APK release.
  fallback-release:
    name: Fallback Patch Release
    runs-on: ubuntu-latest
    environment: release-gated
    needs: [release-please, detect-deployable-changes]
    if: >-
      needs.release-please.outputs.release_created != 'true' &&
      needs.release-please.outputs.pr == '' &&
      contains(github.event.head_commit.message, 'promote develop to main') &&
      needs.detect-deployable-changes.outputs.has_deployable_changes == 'true'
    outputs:
      release_created: ${{ steps.create-release.outputs.release_created || steps.existing-release.outputs.release_created }}
      tag_name: ${{ steps.bump.outputs.tag_name }}
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Generate token for glycemicgpt-release
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "glycemicgpt-release[bot]"
          git config user.email "glycemicgpt-release[bot]@users.noreply.github.com"

      - name: Calculate next patch version
        id: bump
        run: |
          # Read from the triggering commit SHA (immutable across workflow reruns).
          # This prevents computing a different version on rerun after the first
          # run already bumped the manifest on main.
          CURRENT=$(git show ${{ github.sha }}:.release-please-manifest.json | jq -r '.["."]')
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
            echo "::error::Could not read current version from manifest"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT_PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          TAG="v${VERSION}"

          {
            echo "current=$CURRENT"
            echo "version=$VERSION"
            echo "tag_name=$TAG"
          } >> "$GITHUB_OUTPUT"

          # Idempotency: if this tag already exists (workflow rerun after
          # successful first run), skip version bump but still set outputs
          # so downstream jobs can re-run against the existing release.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists (workflow rerun). Skipping version bump."
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
            echo "Fallback: bumping $CURRENT -> $VERSION (tag: $TAG)"
          fi

      - name: Update version files
        if: steps.bump.outputs.already_exists != 'true'
        env:
          CURRENT: ${{ steps.bump.outputs.current }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # release-please state: advance the manifest so the next release-please
          # run computes from this fallback version instead of re-proposing a tag
          # that already exists. This is release-please bookkeeping, not a product
          # version file.
          jq --arg v "$VERSION" '.["."] = $v' .release-please-manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json .release-please-manifest.json

          # Product version files: the three Android module build scripts. Each
          # carries `val appVersionName = "<version>" // x-release-please-version`,
          # from which versionCode is derived. Nothing else (no pyproject.toml, no
          # package.json, no Docker tag) exists to rewrite in this repository.
          for GRADLE_FILE in app/build.gradle.kts \
                             wear-device/build.gradle.kts \
                             watchface/build.gradle.kts; do
            sed -i "s/val appVersionName = \"${CURRENT}\"/val appVersionName = \"${VERSION}\"/" "$GRADLE_FILE"
          done

          # Verify every file was updated
          grep -q "\"${VERSION}\"" .release-please-manifest.json || { echo "::error::Manifest not updated"; exit 1; }
          for GRADLE_FILE in app/build.gradle.kts \
                             wear-device/build.gradle.kts \
                             watchface/build.gradle.kts; do
            grep -q "val appVersionName = \"${VERSION}\"" "$GRADLE_FILE" || { echo "::error::$GRADLE_FILE not updated"; exit 1; }
          done

      - name: Commit, tag, and push
        if: steps.bump.outputs.already_exists != 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag_name }}
        run: |
          git add \
            .release-please-manifest.json \
            app/build.gradle.kts \
            wear-device/build.gradle.kts \
            watchface/build.gradle.kts

          # Idempotent rerun guard: if a prior run already pushed this version bump
          # to main, the working tree matches HEAD and nothing is staged. Skip the
          # commit rather than abort with "nothing to commit", so the tag + release
          # steps below can still recover a run that died after the push.
          if git diff --cached --quiet; then
            echo "Version bump already present on main; skipping commit (idempotent rerun)."
          else
            git commit -m "chore: release ${VERSION}"
          fi

          # Pull any intervening commits before pushing.
          # If rebase fails (conflict), abort and fail the job.
          if ! git pull --rebase origin main; then
            echo "::error::Rebase failed -- intervening commits conflict with version bump"
            git rebase --abort 2>/dev/null || true
            exit 1
          fi

          git tag "$TAG"
          # Push the branch and the tag atomically so they land together (or not at
          # all). A lightweight tag is not pushed by --follow-tags, and letting
          # `gh release create` mint the tag risks anchoring it to whatever main HEAD
          # is at that moment rather than this version-bump commit.
          git push --atomic origin main "refs/tags/$TAG"

      - name: Create GitHub Release
        id: create-release
        if: steps.bump.outputs.already_exists != 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag_name }}
          CURRENT: ${{ steps.bump.outputs.current }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes "Maintenance release (no user-facing changes).

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${CURRENT}...${TAG}" \
            --latest

          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "Created fallback GitHub Release $TAG"

      # On rerun when release already exists, still signal success
      # so downstream jobs (APK build) can re-run.
      - name: Signal existing release on rerun
        id: existing-release
        if: steps.bump.outputs.already_exists == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          # Verify the GitHub Release (not just the tag) exists.
          # A prior run could have pushed the tag but failed before gh release create.
          if gh release view "${{ steps.bump.outputs.tag_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "Rerun: release ${{ steps.bump.outputs.tag_name }} already exists"
          else
            # A prior run pushed the tag but died before creating the Release.
            # Complete the operation idempotently: create the Release from the
            # existing tag (which already points at the version-bump commit).
            echo "Tag exists without a Release; creating it from the existing tag."
            gh release create "${{ steps.bump.outputs.tag_name }}" \
              --repo "${{ github.repository }}" \
              --verify-tag \
              --title "${{ steps.bump.outputs.tag_name }}" \
              --notes "Maintenance release (no user-facing changes)." \
              --latest
            echo "release_created=true" >> "$GITHUB_OUTPUT"
          fi

  release-android-apk:
    name: Build & Upload Release APK
    runs-on: ubuntu-latest
    environment: release-gated
    needs: [release-please, fallback-release]
    if: >-
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        needs.fallback-release.outputs.release_created == 'true'
      )
    env:
      # Signing material is resolved from 1Password at runtime by the composite
      # action below; this is the only signing-related secret in GitHub.
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.ANDROID_ACTIONS_SERVICE_ACCOUNT }}
      # Single source of truth for the post-build cert assertion below. Value
      # is the release signer's SHA-256 fingerprint from the parity-gate
      # runbook's verified reference table (docs/dev/parity-gate-runbook.md).
      # Both repos' release buildTypes silently fall back to debug signing
      # when RELEASE_KEYSTORE_FILE is unset, so this assertion is what turns
      # that silent fallback into a failed job instead of a debug-signed
      # release reaching users.
      RELEASE_SIGNER_SHA256: 55f0d0cdabf20b398ad30a0ce3e998e3192666e5c15e6d378b86e1c8de342990

    steps:
      - name: Resolve version info
        id: version-info
        run: |
          if [ "${{ needs.release-please.outputs.release_created }}" = "true" ]; then
            echo "version=${{ needs.release-please.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ needs.fallback-release.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ needs.fallback-release.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.version-info.outputs.tag_name }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Load release signing secrets from 1Password
        id: signing
        uses: ./.github/actions/op-load-signing-secrets
        with:
          keystore: release

      - name: Build phone release APK
        run: ./gradlew :app:assembleRelease

      - name: Build wear release APK
        id: wear-build
        continue-on-error: true
        run: ./gradlew :wear-device:assembleRelease

      - name: Build watchface release APKs
        id: watchface-build
        continue-on-error: true
        run: ./gradlew :watchface:assembleRelease

      - name: Rename APKs with version
        id: rename-apks
        run: |
          VERSION="${{ steps.version-info.outputs.version }}"

          # Phone APK (required)
          APP_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APP_APK" ]; then
            cp "$APP_APK" "GlycemicGPT-${VERSION}-release.apk"
            echo "Phone APK: GlycemicGPT-${VERSION}-release.apk"
            echo "phone-apk-name=GlycemicGPT-${VERSION}-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Phone APK not found"
            exit 1
          fi

          # Wear APK (optional)
          WEAR_APK=$(find wear-device/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$WEAR_APK" ]; then
            cp "$WEAR_APK" "GlycemicGPT-Wear-${VERSION}-release.apk"
            echo "Wear APK: GlycemicGPT-Wear-${VERSION}-release.apk"
            echo "wear-apk-name=GlycemicGPT-Wear-${VERSION}-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Wear APK not found. Phone APK will still be uploaded."
          fi

          # Watchface APKs (optional -- one per flavor)
          DIGITAL_APK=$(find watchface/build/outputs/apk/digitalFull/release -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$DIGITAL_APK" ]; then
            cp "$DIGITAL_APK" "GlycemicGPT-WatchFace-Digital-${VERSION}-release.apk"
            echo "Digital watchface: GlycemicGPT-WatchFace-Digital-${VERSION}-release.apk"
          else
            echo "::warning::Digital watchface APK not found."
          fi

          ANALOG_APK=$(find watchface/build/outputs/apk/analogMechanical/release -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$ANALOG_APK" ]; then
            cp "$ANALOG_APK" "GlycemicGPT-WatchFace-Analog-${VERSION}-release.apk"
            echo "Analog watchface: GlycemicGPT-WatchFace-Analog-${VERSION}-release.apk"
          else
            echo "::warning::Analog watchface APK not found."
          fi

      - name: Verify release signing certificate (phone + wear)
        env:
          # Routed through env: (not interpolated directly into the script)
          # so the step-output values are never substituted into the shell
          # source text, only into a shell variable.
          PHONE_APK: ${{ steps.rename-apks.outputs.phone-apk-name }}
          WEAR_APK: ${{ steps.rename-apks.outputs.wear-apk-name }}
        run: |
          set -euo pipefail

          # WatchFace APKs are deliberately excluded here -- they are unsigned
          # by long-standing pre-split behavior (see watchface/build.gradle.kts);
          # the artifacts users receive are the committed in-app WFF assets, not
          # the release-page WatchFace APKs. Only the phone and wear APKs are
          # asserted against the release signer.
          #
          # Both phone AND wear are required here -- unlike the rename step
          # above, which treats a missing wear APK as a warning (wear-build
          # keeps continue-on-error: true so its own step can report
          # failure without blocking earlier diagnostics). The parity-gate
          # runbook's global rule 4 (docs/dev/parity-gate-runbook.md) treats
          # a wear-build failure at release time as gate-blocking regardless
          # of continue-on-error, so this step intentionally hard-fails the
          # job if the wear APK is missing rather than silently publishing
          # phone-only.

          # Resolve apksigner from the highest installed build-tools version
          # (Android Gradle Plugin already requires build-tools on this
          # runner to build the APKs above; apksigner's cert-verification
          # behavior does not vary across recent versions, but picking the
          # highest keeps this deterministic rather than relying on
          # filesystem glob order).
          APKSIGNER=""
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/build-tools" ]; then
            LATEST_BUILD_TOOLS=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | sort -V | tail -1)
            if [ -n "$LATEST_BUILD_TOOLS" ] && [ -x "$SDK_ROOT/build-tools/$LATEST_BUILD_TOOLS/apksigner" ]; then
              APKSIGNER="$SDK_ROOT/build-tools/$LATEST_BUILD_TOOLS/apksigner"
            fi
          fi
          APKSIGNER="${APKSIGNER:-apksigner}"

          verify_cert() {
            local apk="$1" label="$2"
            if [ -z "$apk" ] || [ ! -f "$apk" ]; then
              echo "::error::$label APK not found (path: '$apk') -- cannot verify signing certificate"
              exit 1
            fi

            # `|| true` on the extraction pipeline: an unmatched grep (or an
            # apksigner failure that leaves no digest line to match) exits
            # non-zero, which under pipefail would abort the script here via
            # set -e before the friendlier ::error:: below ever runs. Any
            # apksigner-side failure still surfaces -- its own stderr output
            # is not captured by $(...) and prints directly to the job log --
            # and an empty $sha256 is still caught and failed below either way.
            local sha256
            sha256=$("$APKSIGNER" verify --print-certs "$apk" \
              | grep -i 'SHA-256 digest' | grep -oE '[0-9a-fA-F]{64}' | tr 'A-F' 'a-f' | head -1 || true)
            if [ -z "$sha256" ]; then
              echo "::error::Could not extract a SHA-256 certificate digest from $label APK ($apk)"
              exit 1
            fi

            if [ "$sha256" != "$RELEASE_SIGNER_SHA256" ]; then
              echo "::error::$label signing certificate mismatch: got $sha256, expected $RELEASE_SIGNER_SHA256 (release keystore likely absent -- build fell back to debug signing)"
              exit 1
            fi
            echo "$label signing certificate verified: $sha256"
          }

          verify_cert "$PHONE_APK" "Phone"
          verify_cert "$WEAR_APK" "Wear"

      - name: Generate token for glycemicgpt-release
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          TAG="${{ steps.version-info.outputs.tag_name }}"
          gh release upload "$TAG" GlycemicGPT-*-release.apk --repo ${{ github.repository }} --clobber

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apk
          path: GlycemicGPT-*-release.apk
          retention-days: 90

      - name: Remove materialized keystore
        if: always()
        run: rm -f "${{ steps.signing.outputs.keystore-path }}"
