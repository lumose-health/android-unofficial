name: Dev Pre-Release

# Publishes the signed `dev-latest` pre-release the in-app updater's dev channel
# polls. Signing material is resolved from 1Password at runtime by the
# op-load-signing-secrets composite action; there is no base64 keystore and no
# unsigned fallback. If the service-account token is unset the composite action
# fails the job before any build, so a dev APK is never published unsigned.

on:
  push:
    branches: [develop]
    paths:
      - 'app/**'
      - 'wear-device/**'
      - 'watchface/**'
      - 'plugins/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'settings-gradle.lockfile'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/dev-pre-release.yml'

concurrency:
  group: dev-pre-release
  cancel-in-progress: false

# Least privilege: the default GITHUB_TOKEN is read-only. The dev-latest
# pre-release is published with a scoped glycemicgpt-ci App token exported as
# GH_TOKEN (see the "Publish dev-latest pre-release" step) and the checkout uses
# persist-credentials: false, so the ambient token never needs write.
permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      # The only signing-related secret in GitHub. The composite action inherits
      # it from this job env and fails the job if it is unset (fail-closed).
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.ANDROID_ACTIONS_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Load debug signing secrets from 1Password
        id: signing
        uses: ./.github/actions/op-load-signing-secrets
        with:
          keystore: debug

      - name: Compute dev-channel run number
        id: dev-run-number
        run: |
          # Offset added to github.run_number for this repo's dev-channel
          # numbering (embedded in BuildConfig.DEV_BUILD_NUMBER via
          # -PdevBuildNumber and in the dev-latest release asset filename that
          # AppUpdateChecker.parseDevRunNumber reads back). This repo's own
          # run counter restarted near 0 after the repo split, while the
          # monorepo-built cohort already has dev.145 installed; the
          # updater's strictly-greater comparison would otherwise report
          # "up to date" forever and strand every migrated dev user (see
          # docs/dev/parity-gate-runbook.md, P1.1). Remove this offset once
          # this repo's native run_number has climbed past the highest
          # monorepo-lineage dev number on its own.
          DEV_RUN_NUMBER_OFFSET=500
          echo "run_number=$(( GITHUB_RUN_NUMBER + DEV_RUN_NUMBER_OFFSET ))" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug -PdevBuildNumber=${{ steps.dev-run-number.outputs.run_number }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'val appVersionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Extracted version '$VERSION' does not look like semver"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APKs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RUN="${{ steps.dev-run-number.outputs.run_number }}"
          PHONE_SRC="app/build/outputs/apk/debug/app-debug.apk"
          WEAR_SRC="wear-device/build/outputs/apk/debug/wear-device-debug.apk"

          mkdir -p dist
          if [ -f "$PHONE_SRC" ]; then
            cp "$PHONE_SRC" "dist/GlycemicGPT-${VERSION}-dev.${RUN}-debug.apk"
          fi
          if [ -f "$WEAR_SRC" ]; then
            cp "$WEAR_SRC" "dist/GlycemicGPT-Wear-${VERSION}-dev.${RUN}-debug.apk"
          fi

          # Verify at least one APK was produced
          if ! ls dist/*.apk >/dev/null 2>&1; then
            echo "ERROR: No APK files found in dist/"
            exit 1
          fi

      - name: Generate token for glycemicgpt-ci
        id: ci-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Publish dev-latest pre-release
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RUN="${{ steps.dev-run-number.outputs.run_number }}"
          COMMIT="${{ github.sha }}"
          SHORT_SHA="${COMMIT:0:7}"

          # Delete existing release+tag, then immediately recreate (single step to reduce window)
          gh release delete dev-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create dev-latest \
            --title "${VERSION}-dev.${RUN}" \
            --notes "Development build from \`develop\` branch.

          **Version:** ${VERSION}-dev.${RUN}
          **Commit:** ${SHORT_SHA}
          **Branch:** develop

          > This is an unstable development build. Use the [latest stable release](https://github.com/${{ github.repository }}/releases/latest) for production use." \
            --prerelease \
            --target develop \
            dist/*.apk

      - name: Remove materialized keystore
        if: always()
        run: rm -f "${{ steps.signing.outputs.keystore-path }}"
